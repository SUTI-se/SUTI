meta:
  standard: SUTI
  sourceFiles:
  - SUTI_Attribute_List.csv
  - SUTI_Enumeration_Values.csv
  notes:
  - SUTI_ValueText is the code value used in messages.
  - SUTI_ValueDescription in ENG row is treated as description; in other languages it is treated as localized label/term.
  - internationalization contains localized labels; description is English description when available.
  - All 657 enumeration entries from source CSV files are now included.
